<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Froth mark: the map IS the metaphor. Bubbles are papers, thin lines are similarity,
       and the dashed amber ring is a bridge paper - one sitting between two subtopics,
       which is exactly what Froth is built to surface. -->
  <rect width="64" height="64" rx="15" fill="#1f1f23"/>
  <g stroke="#52525b" stroke-width="1.3" stroke-linecap="round">
    <line x1="20" y1="24" x2="33" y2="17"/>
    <line x1="20" y1="24" x2="27" y2="40"/>
    <line x1="33" y1="17" x2="45" y2="27"/>
    <line x1="27" y1="40" x2="43" y2="44"/>
    <line x1="45" y1="27" x2="43" y2="44"/>
  </g>
  <circle cx="20" cy="24" r="8" fill="#6366f1"/>
  <circle cx="17.6" cy="21.4" r="2.5" fill="#ffffff" opacity="0.3"/>
  <circle cx="33" cy="17" r="5" fill="#8b5cf6"/>
  <circle cx="45" cy="27" r="5.6" fill="#378ADD"/>
  <circle cx="43" cy="44" r="4.2" fill="#14b8a6"/>
  <circle cx="27" cy="40" r="6.4" fill="#27272a"
          stroke="#f59e0b" stroke-width="2.4" stroke-dasharray="4.5 3"/>
</svg>
