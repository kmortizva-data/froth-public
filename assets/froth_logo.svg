<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 64" width="210" height="64">
  <!-- Froth wordmark. Replaces the LitMap logo the project shipped until 2026-08-08.
       The mark reads as a small cluster map: bubbles are papers, thin lines are
       similarity, and the dashed amber ring marks a bridge paper. -->
  <g stroke="#52525b" stroke-width="1.3" stroke-linecap="round">
    <line x1="15" y1="27" x2="28" y2="20"/>
    <line x1="15" y1="27" x2="22" y2="43"/>
    <line x1="28" y1="20" x2="40" y2="30"/>
    <line x1="22" y1="43" x2="38" y2="47"/>
    <line x1="40" y1="30" x2="38" y2="47"/>
  </g>
  <circle cx="15" cy="27" r="8" fill="#6366f1"/>
  <circle cx="12.6" cy="24.4" r="2.5" fill="#ffffff" opacity="0.3"/>
  <circle cx="28" cy="20" r="5" fill="#8b5cf6"/>
  <circle cx="40" cy="30" r="5.6" fill="#378ADD"/>
  <circle cx="38" cy="47" r="4.2" fill="#14b8a6"/>
  <circle cx="22" cy="43" r="6.4" fill="#18181b"
          stroke="#f59e0b" stroke-width="2.4" stroke-dasharray="4.5 3"/>
  <text x="62" y="42" font-family="Inter, -apple-system, 'Segoe UI', sans-serif"
        font-size="31" font-weight="600" fill="#fafafa" letter-spacing="-0.4">Froth</text>
</svg>
